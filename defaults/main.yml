---
Timezone: "America/New_York"

# May not need

pihole_system_dnsmasq: "{{ container_conf_dir }}/dnsmasq.d/"
pihole_system_etc_pihole: "{{ container_conf_dir }}/pihole"
pihole_listen_port: 1053

# Rendered configs; a change restarts the service (generic post).
# Not custom.list/adlists.list: pihole edits those itself.
container_restart_watch:
  - "{{ container_prefix }}/etc/dnsmasq.d/02-port.conf"
